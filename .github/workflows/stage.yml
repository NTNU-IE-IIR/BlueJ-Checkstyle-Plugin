name: Stage release with manually assigned versions

on:
  workflow_dispatch:
    inputs:
      releaseVersion:
        description: 'Release version'
        required: true 
        type: string
      nextDevelopmentVersion:
        description: 'Next development version'
        required: true 
        type: string

jobs:
  perform-release:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
      contents: write  # push the release commits and tag (via the checkout's GITHUB_TOKEN)
      actions: write   # trigger publish.yml

    steps:
      - name: Git Checkout
        uses: actions/checkout@v7
        with:
          ref: 'develop'

      - name: Set GitHub Actions as commit author
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Perform Maven Release
        run: 
          mvn release:clean release:prepare release:perform 
            -DreleaseVersion=${{ inputs.releaseVersion }} 
            -DdevelopmentVersion=${{ inputs.nextDevelopmentVersion }} 
            -Darguments="-Dmaven.javadoc.skip=true -Dmaven.deploy.skip=true"

      - name: Trigger publish workflow
        uses: actions/github-script@v9
        with:
          script: |
            github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'publish.yml',
              ref: 'main',
              inputs: {
                tag_ref: 'v${{ inputs.releaseVersion }}',
              },
            })
