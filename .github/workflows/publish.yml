name: Publish release

on:
  workflow_dispatch:
    inputs:
      tag_ref:
        description: 'Tag ref to publish release for'
        required: true
        type: string

jobs:
  create-release:
    runs-on: ubuntu-latest
    
    steps:
      - name: Git Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # full history, so the release tag can be merged into main

      - name: Merge release tag to main branch
        run: |
          git fetch
          git merge ${{ inputs.tag_ref }}
          git push

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
      
      - name: Build with Maven
        run: mvn -B package --file pom.xml

      - name: Get version
        run: |
          VERSION=$( mvn help:evaluate -Dexpression=project.version -q -DforceStdout )
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        id: get_version
      
      - name: Upload release to GitHub Releases
        uses: softprops/action-gh-release@v3
        with: 
          tag_name: v${{ steps.get_version.outputs.version }}
          name: v${{ steps.get_version.outputs.version }}
          body: "**Changes:**"
          files: ./target/*-${{ steps.get_version.outputs.version }}.jar
